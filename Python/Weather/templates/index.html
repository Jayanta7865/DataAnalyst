<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather App</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            margin: 0;
            padding: 0;
            text-align: center;
            color: white;
        }

        .container {
            margin-top: 100px;
            background: rgba(0,0,0,0.3);
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            padding: 10px;
            width: 70%;
            border: none;
            border-radius: 8px;
            outline: none;
        }

        button {
            padding: 10px 15px;
            border: none;
            background: #ff7eb3;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            margin-left: 5px;
        }

        button:hover {
            background: #ff4e9b;
        }

        .result {
            margin-top: 20px;
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 10px;
        }

        .temp {
            font-size: 28px;
            font-weight: bold;
        }

        .desc {
            text-transform: capitalize;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>🌦️ Weather App</h2>

    <form method="POST">
        <input type="text" name="city" placeholder="Enter city..." required>
        <button type="submit">Search</button>
    </form>

    {% if weather %}
    <div class="result">
        <h3>{{ weather.city }}</h3>
        <div class="temp">{{ weather.temp }} °C</div>
        <div class="desc">{{ weather.desc }}</div>
    </div>
    {% endif %}
</div>

</body>
</html>
